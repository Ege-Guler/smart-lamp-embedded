<!DOCTYPE html>
<html>

<head>
    <title>ESP8266 Web Server</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <h1>H2 Industries Smart Lamp</h1>

    <div>
        <form action="/submit" method="get">
            <label for="ssid">SSID</label>
            <input type="text" id="ssid" name="ssid" placeholder="h2industries">

            <label for="passwd">Password</label>
            <input type="text" id="passwd" name="passwd" placeholder="**********">

            <input class="btn" type="submit" value="Connect">
        </form>

    </div>

<footer>
    <p>Designed in Istanbul</p>
    <p>~ v 1.0.0 ~ </p>
</footer>

</body>

</html>
