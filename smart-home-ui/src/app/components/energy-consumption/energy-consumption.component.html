<mat-card class="energy-card">
  <mat-card-header>
    <mat-card-title>Energy Consumption</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <!-- Line chart for power usage over time -->
    <div class="chart-container" *ngIf="wattageChartData.length > 0; else noData">
      <ngx-charts-line-chart
        [view]="view"
        [scheme]="colorScheme"
        [results]="wattageChartData"
        [gradient]="gradient"
        [xAxis]="showXAxis"
        [yAxis]="showYAxis"
        [legend]="showLegend"
        [showXAxisLabel]="showXAxisLabel"
        [showYAxisLabel]="showYAxisLabel"
        [xAxisLabel]="xAxisLabel"
        [yAxisLabel]="yAxisLabel"
        [autoScale]="autoScale"
        [curve]="'monotoneX'">
      </ngx-charts-line-chart>
    </div>
    <ng-template #noData>
      <div class="no-data-message">
        <mat-icon>show_chart</mat-icon>
        <p>Waiting for energy consumption data...</p>
      </div>
    </ng-template>

    <!-- Energy stats cards -->
    <div class="stats-container">
      <div class="stat-card" [style.border-color]="getWattageColor()">
        <mat-icon [style.color]="getWattageColor()">{{ getWattageIcon() }}</mat-icon>
        <div class="stat-content">
          <div class="stat-title">Current Power</div>
          <div class="stat-value" [style.color]="getWattageColor()">{{ getFormattedWattage() }}</div>
        </div>
      </div>

      <div class="stat-card">
        <mat-icon class="icon-primary">timer</mat-icon>
        <div class="stat-content">
          <div class="stat-title">Session Energy</div>
          <div class="stat-value">{{ getFormattedSessionEnergy() }}</div>
        </div>
      </div>

      <div class="stat-card">
        <mat-icon class="icon-primary">history</mat-icon>
        <div class="stat-content">
          <div class="stat-title">Lifetime Energy</div>
          <div class="stat-value">{{ getFormattedLifetimeEnergy() }}</div>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
