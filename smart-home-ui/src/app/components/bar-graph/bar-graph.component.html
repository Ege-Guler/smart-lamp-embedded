<mat-card class="chart-card">
  <mat-card-header>
    <mat-card-title>Energy Usage</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="chart-container">
      <ngx-charts-bar-vertical-2d
        [view]="view"
        [scheme]="colorScheme"
        [results]="data"
        [gradient]="gradient"
        [xAxis]="showXAxis"
        [yAxis]="showYAxis"
        [legend]="showLegend"
        [showXAxisLabel]="showXAxisLabel"
        [showYAxisLabel]="showYAxisLabel"
        [xAxisLabel]="xAxisLabel"
        [yAxisLabel]="yAxisLabel">
      </ngx-charts-bar-vertical-2d>
    </div>
  </mat-card-content>
</mat-card>
